<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Magic Link</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; border-radius: 10px 10px 0 0;">
        <h1 style="color: white; margin: 0;">Your Magic Link</h1>
    </div>
    
    <div style="background: #f9fafb; padding: 30px; border-radius: 0 0 10px 10px;">
        <p style="font-size: 16px; margin-bottom: 20px;">Hello,</p>
        
        <p style="font-size: 16px; margin-bottom: 20px;">
            Click the button below to log in to your account. This link will expire in {expiry_minutes} minutes.
        </p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{magic_link_url}" 
               style="display: inline-block; background: #3B82F6; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px;">
                Log In Now
            </a>
        </div>
        
        <p style="font-size: 14px; color: #6b7280; margin-top: 30px;">
            If the button doesn't work, copy and paste this link into your browser:<br>
            <a href="{magic_link_url}" style="color: #3B82F6; word-break: break-all;">{magic_link_url}</a>
        </p>
        
        <p style="font-size: 14px; color: #6b7280; margin-top: 20px;">
            If you didn't request this link, please ignore this email.
        </p>
    </div>
</body>
</html>
